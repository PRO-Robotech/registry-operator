# Учётка CI-робота заказа в kaname; ключ SECRET доставляется в Vault под лист zot-<id>.
apiVersion: observed.registry.in-cloud.io/v1alpha1
kind: ObservedIamServiceAccountTemplate
metadata:
  name: zot-robot-v1
spec:
  templateName: zot-robot
  version: v1
  nameSuffix: -ci
  value: |
    description: {{ printf "CI robot of registry %s" .ID | toJson }}
    enabled: true
    labels:
      registry: {{ .ID | toJson }}
    keys:
    - name: push
      kind: Secret
      ttlSeconds: {{ .Params.identity.keyTTLSeconds | toJson }}
      delivery:
        vault:
          app: docker-registry
          instance: {{ printf "zot-%s" .ID | toJson }}
