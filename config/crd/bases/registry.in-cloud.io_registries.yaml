---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: registries.registry.in-cloud.io
spec:
  group: registry.in-cloud.io
  names:
    categories:
    - registry
    kind: Registry
    listKind: RegistryList
    plural: registries
    shortNames:
    - reg
    singular: registry
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.id
      name: ID
      type: string
    - jsonPath: .spec.templateRef.name
      name: Template
      type: string
    - jsonPath: .spec.templateRef.version
      name: Version
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.endpoint
      name: Endpoint
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Registry — заказ регистри в namespace арендатора. login арендатора —
          metadata.namespace заказа.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RegistrySpec — заказ регистри. Всё, что выводится из шаблона, в заказе не
              пишется: заказ несёт id, ревизию шаблона и судьбу бакета при удалении.
            properties:
              deletionPolicy:
                default: Retain
                description: |-
                  DeletionPolicy — судьба бакета при удалении заказа. Retain (умолчание)
                  оставляет бакет и его ключи; Purge стирает их. Purge доходит до
                  S3BucketClaim только в фазе Deleting.
                enum:
                - Retain
                - Purge
                type: string
              id:
                description: |-
                  ID — неизменяемый идентификатор регистри; он же имя объекта и основа
                  имён дочерних ресурсов. Повторно не выдаётся (RegistryIDReservation).
                maxLength: 20
                pattern: ^[a-z0-9]{6,20}$
                type: string
                x-kubernetes-validations:
                - message: id must not start with 'reg'
                  rule: '!self.startsWith(''reg'')'
                - message: id is immutable
                  rule: self == oldSelf
              public:
                default: false
                description: |-
                  Public — анонимное чтение образов регистри: pull без токена. По
                  умолчанию закрыто; запись анонимной не бывает никогда.
                type: boolean
              templateRef:
                description: |-
                  TemplateRef — ревизия RegistryTemplate. Меняется только version:
                  смена версии — переход заказа на новую ревизию.
                properties:
                  name:
                    description: Name — имя линии шаблона (templateName).
                    maxLength: 42
                    pattern: ^[a-z0-9]([a-z0-9-]{0,40}[a-z0-9])?$
                    type: string
                  version:
                    description: 'Version — ревизия линии: v1, v2, …'
                    maxLength: 7
                    pattern: ^v[0-9]{1,6}$
                    type: string
                required:
                - name
                - version
                type: object
                x-kubernetes-validations:
                - message: templateRef.name is immutable; only templateRef.version
                    may change
                  rule: self.name == oldSelf.name
            required:
            - id
            - templateRef
            type: object
          status:
            description: |-
              RegistryStatus — публичная проекция состояния заказа. Читается арендатором
              и BFF: здесь только коды и фиксированные тексты.
            properties:
              conditions:
                description: 'Conditions — условия заказа: сводное Ready и по каждому
                  шагу.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              deletingSince:
                description: DeletingSince — начало удаления.
                format: date-time
                type: string
              endpoint:
                description: 'Endpoint — адрес регистри: <host>/<id>.'
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                description: RegistryPhase — сводное состояние заказа.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                - Upgrading
                - Deleting
                - Failed
                type: string
              progressingSince:
                description: ProgressingSince — начало текущего периода неготовности.
                format: date-time
                type: string
              provisioned:
                description: Provisioned — заказ хотя бы раз был готов (защёлка).
                type: boolean
              registration:
                description: Registration — регистрация ресурса регистри в IAM.
                properties:
                  object:
                    description: 'Object — объект модели прав: registry_registry:<id>.'
                    type: string
                  ready:
                    description: Ready — регистрация применена с цепью предков текущего
                      проекта.
                    type: boolean
                  reason:
                    description: Reason — код из каталога причин.
                    type: string
                required:
                - object
                - ready
                - reason
                type: object
              resources:
                description: Resources — ресурсы пайплайна по шагам.
                items:
                  description: |-
                    ResourceStatus — состояние ресурса шага (публичная проекция: только код
                    причины).
                  properties:
                    apiVersion:
                      description: APIVersion и Kind — вид ресурса.
                      type: string
                    kind:
                      type: string
                    name:
                      type: string
                    namespace:
                      description: Namespace — пусто у ресурса уровня Cluster.
                      type: string
                    ready:
                      description: Ready — ресурс готов на своём текущем поколении.
                      type: boolean
                    reason:
                      description: Reason — код из каталога причин.
                      type: string
                    step:
                      description: Step — шаг пайплайна.
                      enum:
                      - storage
                      - identity
                      - secrets
                      - registration
                      - access
                      - workload
                      - route
                      type: string
                  required:
                  - apiVersion
                  - kind
                  - name
                  - ready
                  - reason
                  - step
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              sync:
                description: |-
                  SyncRecoveryStatus — восстановление синхронизации рабочей нагрузки после
                  исчерпанного повтора Argo CD: эпоха синхронизации в переменных Addon.
                properties:
                  attempts:
                    description: Attempts — подряд выполненных продвижений эпохи без
                      восстановления.
                    format: int32
                    type: integer
                  epoch:
                    description: Epoch — текущая эпоха синхронизации; растёт монотонно.
                    format: int64
                    type: integer
                  lastAdvanceTime:
                    description: LastAdvanceTime — когда эпоха продвинута последний
                      раз.
                    format: date-time
                    type: string
                  stuckSince:
                    description: StuckSince — когда синхронизация замечена застрявшей.
                    format: date-time
                    type: string
                type: object
              template:
                description: Template — ревизия, по которой отрисованы текущие ресурсы.
                properties:
                  name:
                    description: Name — имя линии шаблона (templateName).
                    maxLength: 42
                    pattern: ^[a-z0-9]([a-z0-9-]{0,40}[a-z0-9])?$
                    type: string
                  version:
                    description: 'Version — ревизия линии: v1, v2, …'
                    maxLength: 7
                    pattern: ^v[0-9]{1,6}$
                    type: string
                required:
                - name
                - version
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must equal spec.id
          rule: self.metadata.name == self.spec.id
    served: true
    storage: true
    subresources:
      status: {}
