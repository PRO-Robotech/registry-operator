---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: observedaddontemplates.observed.registry.in-cloud.io
spec:
  group: observed.registry.in-cloud.io
  names:
    categories:
    - registry-templates
    kind: ObservedAddonTemplate
    listKind: ObservedAddonTemplateList
    plural: observedaddontemplates
    shortNames:
    - oat
    singular: observedaddontemplate
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.templateName
      name: Template
      type: string
    - jsonPath: .spec.version
      name: Version
      type: string
    - jsonPath: .spec.chart.version
      name: Chart
      type: string
    - jsonPath: .status.conditions[?(@.type=="Accepted")].status
      name: Accepted
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ObservedAddonTemplate — шаблон spec Addon заказа: поставить zot с нужными
          путями (бакет, endpoint, лист Vault, роль Vault) из статусов готовых шагов.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ObservedAddonTemplateSpec — неизменяемая ревизия шаблона
              Addon.
            properties:
              chart:
                description: |-
                  Chart — закреплённый чарт; repoURL, chart и version Addon оператор
                  ставит только отсюда, шаблон их не пишет.
                properties:
                  digest:
                    description: Digest — digest манифеста OCI этой версии.
                    maxLength: 71
                    pattern: ^sha256:[a-f0-9]{64}$
                    type: string
                  name:
                    description: Name — имя чарта.
                    maxLength: 63
                    pattern: ^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$
                    type: string
                  repoURL:
                    description: 'RepoURL — репозиторий чартов OCI: oci://host[:port]/path.'
                    maxLength: 512
                    pattern: ^oci://[a-z0-9]([a-z0-9.-]*[a-z0-9])?(:[0-9]{1,5})?(/[a-z0-9]([a-z0-9._-]*[a-z0-9])?)+$
                    type: string
                  version:
                    description: Version — версия чарта (тег OCI).
                    maxLength: 64
                    pattern: ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$
                    type: string
                required:
                - digest
                - name
                - repoURL
                - version
                type: object
              templateName:
                description: TemplateName — имя линии ревизий.
                maxLength: 42
                pattern: ^[a-z0-9]([a-z0-9-]{0,40}[a-z0-9])?$
                type: string
              value:
                description: |-
                  Value — Go-шаблон spec цели (YAML). Контекст закрыт: .Registry, .ID,
                  .Login, .Params, .Template и .Status.<ресурс> уже готовых шагов.
                  Каждое печатающее действие кончается на toJson (поля заказа и статусы
                  дочерних — только так) либо на toYaml | nindent (только .Params);
                  define, template, block, объявления переменных и цепочки запрещены.
                maxLength: 65536
                minLength: 1
                type: string
              version:
                description: Version — ревизия линии.
                maxLength: 7
                pattern: ^v[0-9]{1,6}$
                type: string
            required:
            - chart
            - templateName
            - value
            - version
            type: object
            x-kubernetes-validations:
            - message: template spec is immutable; publish a new version
              rule: self == oldSelf
          status:
            description: TemplateStatus — состояние ревизии шаблона (общая форма всех
              видов).
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name must be <templateName>-<version>
          rule: self.metadata.name == self.spec.templateName + '-' + self.spec.version
    served: true
    storage: true
    subresources:
      status: {}
