apiVersion: vault.in-cloud.io/v1alpha1
kind: VaultClaim
metadata:
  name: zot-abc123
  namespace: cust01
  labels:
    app.kubernetes.io/managed-by: registry-operator
    registry.in-cloud.io/id: abc123
    registry.in-cloud.io/namespace: cust01
    registry.in-cloud.io/owner-uid: 6f1c2a3b-4d5e-4f60-8a71-92b3c4d5e6f7
    registry.in-cloud.io/template: zot-v1
    registry.in-cloud.io/step: secrets
spec:
  vaultConfigRef:
    name: default
  secretsPrefix: clusters/site-a/abc123
  auth:
    mountPath: kubernetes-site-a
    manageConfig: false
    autoCreate: false
    rolePruning: Owned
  policies:
  - name: zot-abc123-leaf
    identityPaths:
    - path: secret/data/clusters/site-a/abc123/namespaces/{serviceAccountNamespace}/apps/docker-registry/{serviceAccountName}
      capabilities: [read]
  roles:
  - name: zot-abc123
    boundServiceAccounts:
      names: [zot-abc123]
      namespace: cust01
    policies: [zot-abc123-leaf]
    audience: vault
    tokenType: service
    tokenTTL: 1h
  deletionPolicy: Retain
