apiVersion: addons.in-cloud.io/v1alpha1
kind: Addon
metadata:
  name: reg-abc123
  labels:
    app.kubernetes.io/managed-by: registry-operator
    registry.in-cloud.io/id: abc123
    registry.in-cloud.io/namespace: cust01
    registry.in-cloud.io/owner-uid: 6f1c2a3b-4d5e-4f60-8a71-92b3c4d5e6f7
    registry.in-cloud.io/template: zot-v1
    registry.in-cloud.io/step: workload
  annotations:
    registry.in-cloud.io/chart-digest: sha256:acf4e9b3f3cace43e81cb7eae9c52553217f30b4578fd812ef55657286390304
spec:
  repoURL: oci://ghcr.io/pro-robotech/charts
  chart: registry-instance
  version: 1.0.0
  releaseName: zot-abc123
  targetCluster: in-cluster
  targetNamespace: cust01
  pluginName: helm-with-values
  backend:
    type: argocd
    namespace: argocd
    project: registry-cust01
    finalizer: true
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions: [ServerSideApply=true, FailOnSharedResource=true]
