        limit: 10
        backoff:
          duration: 10s
          factor: 2
          maxDuration: 5m
  valuesSelectors:
  - name: site
    priority: 10
    matchLabels:
      addons.in-cloud.io/addon: registry-instance
      addons.in-cloud.io/values: site
  - name: order
    priority: 20
    matchLabels:
      addons.in-cloud.io/addon: registry-instance
      addons.in-cloud.io/values: order
  variables:
    id: abc123
    login: cust01
    registryUID: 6f1c2a3b-4d5e-4f60-8a71-92b3c4d5e6f7
    syncEpoch: "0"
    public: "false"
    bucket: cust01-zot-abc123
    endpoint: https://s3.example.test
    region: ru-1
    vaultSecretPath: secret/data/clusters/site-a/abc123/namespaces/cust01/apps/docker-registry/zot-abc123
    vaultAuthMount: kubernetes-site-a
    vaultRole: zot-abc123
