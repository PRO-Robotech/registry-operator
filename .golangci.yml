version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - copyloopvar
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - gosec
        path: _test\.go
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
