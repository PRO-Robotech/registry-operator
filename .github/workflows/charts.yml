# Чарты registry-instance и registry-platform: lint, рендер с golden-сверкой и пробами
# формы, схемы, ct lint, пробы политик допуска на kind; публикация OCI — на теги.
name: charts

on:
  push:
    branches: ["**"]
    tags: ["registry-instance-*", "registry-platform-*"]
    paths:
      - charts/**
      - .github/workflows/charts.yml
  pull_request:
    paths:
      - charts/**
      - .github/workflows/charts.yml

permissions:
  contents: read

env:
  HELM_VERSION: v3.22.1
  KUBECONFORM_VERSION: v0.7.0
  KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
  OPENAPI2JSONSCHEMA_SHA256: d145babfbb765004030764e1b4e518bfb7a4bd7f111691a08fa57983b81881f3

jobs:
  render:
    name: render, golden, probes, schemas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: tools
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.2
          curl -fsSL -o /tmp/kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  /tmp/kc.tgz" | sha256sum -c -
          tar -xzf /tmp/kc.tgz -C /usr/local/bin kubeconform
          curl -fsSL -o /tmp/openapi2jsonschema.py "https://raw.githubusercontent.com/yannh/kubeconform/${KUBECONFORM_VERSION}/scripts/openapi2jsonschema.py"
          echo "${OPENAPI2JSONSCHEMA_SHA256}  /tmp/openapi2jsonschema.py" | sha256sum -c -
      - name: schemas from pinned CRDs
        run: |
          charts/tests/crds.sh "$RUNNER_TEMP/crds"
          mkdir -p "$RUNNER_TEMP/schemas" && cd "$RUNNER_TEMP/schemas"
          FILENAME_FORMAT='{fullgroup}-{kind}_{version}' python /tmp/openapi2jsonschema.py "$RUNNER_TEMP"/crds/*.yaml > /dev/null
          ls | wc -l
      - name: charts/tests/run.sh
        env:
          SCHEMAS: ${{ runner.temp }}/schemas
        run: charts/tests/run.sh
      - name: rendered output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: charts-out
          path: charts/tests/out/
          retention-days: 7

  ct:
    name: chart-testing lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2.7.0
      - name: ct lint
        run: |
          # ct берёт ci/*-values.yaml каждого чарта: входы — те же, что у run.sh.
          python -m pip install --disable-pip-version-check pyyaml==6.0.2
          charts/tests/ct-values.sh
          ct lint --config charts/ct.yaml --all

  admission:
    name: admission policies on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3 # v1.12.0
        with:
          version: v0.29.0
          cluster_name: admission
      - name: probes
        run: |
          python -m pip install --disable-pip-version-check pyyaml==6.0.2
          charts/tests/crds.sh "$RUNNER_TEMP/crds"
          CRDS="$RUNNER_TEMP/crds" charts/tests/admission/run.sh

  publish:
    name: publish OCI
    if: startsWith(github.ref, 'refs/tags/registry-instance-') || startsWith(github.ref, 'refs/tags/registry-platform-')
    needs: [render, ct, admission]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: ${{ env.HELM_VERSION }}
      - name: package and push
        env:
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: charts/publish.sh "$REF"
