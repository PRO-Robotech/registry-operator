# Площадка-пример: все имена и адреса — вымышленные (example.test).
instanceChart:
  pins:
    - version: 1.0.0
      digest: sha256:1d6a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8
addon:
  backend:
    namespace: argocd
    projectMode: shared
    project: registry
site:
  caBundle:
    configMap: platform-ca
    key: ca.crt
  vault:
    address: https://vault.vault.svc:8200
    tokenAudience: vault
  kaname:
    apiURL: https://kaname.example.test
    jwksURL: https://kaname.example.test:9097/.well-known/jwks.json
    issuer: https://kaname.example.test
    audience: registry
  registryOperator:
    registrationURL: https://registry-operator.registry-system.svc:9443/v1/repositories
    tokenAudience: registry-operator
  iamProxy:
    decisionCacheTTL: 10s
  images:
    zot:
      repository: ghcr.io/project-zot/zot-linux-amd64
      tag: v2.1.20
      digest: sha256:95a837a0afacf5b7edc0c92493f04beee6891989b8d2fd50a00cf65a1e6d4fd5
    iamProxy:
      repository: docker.io/prorobotech/registry-iam-proxy
      tag: v0.1.0
      digest: sha256:2e7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
  edge:
    proxy:
      namespace: envoy-gateway-system
      gateway:
        name: registry-gw
        namespace: registry-edge
  network:
    allowKubeletProbes: false
    dns:
      namespace: kube-system
      labels:
        k8s-app: kube-dns
    vault:
      - namespace: vault
        labels:
          app.kubernetes.io/name: vault
        ports: [8200]
    kaname:
      - fqdn: kaname.example.test
        ports: [443, 9097]
    registryOperator:
      - namespace: registry-system
        labels:
          app.kubernetes.io/name: registry-operator
        ports: [9443]
  resources:
    zot:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 1Gi}
    iamProxy:
      requests: {cpu: 20m, memory: 32Mi}
      limits: {memory: 128Mi}
    vaultAgent:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {cpu: 100m, memory: 64Mi}
    scratchSizeLimit: 2Gi
kanameModule:
  enabled: true
  namespace: kaname
  configMapName: registry-module-manifest
  systemAccount: kacho-system
sharedRoutes:
  enabled: true
  namespace: registry-edge
  gateway:
    name: registry-gw
    namespace: registry-edge
    sectionName: https
  host: registry.example.test
  apiRoot:
    backend:
      namespace: registry-system
      name: registry-api-root
      port: 8080
  token:
    backend:
      namespace: kaname
      name: kaname-token
      port: 8080
gateway:
  enabled: true
  name: registry-gw
  namespace: registry-edge
  gatewayClassName: envoy-gateway
  sectionName: https
  host: registry.example.test
  certificateSecretName: registry-edge-tls
  routeNamespaceLabels:
    registry.in-cloud.io/edge: "true"
