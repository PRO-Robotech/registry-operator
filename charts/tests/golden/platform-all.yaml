      message: "a registry binding grants an allowed role on its own registry to its own robots only"
      reason: Forbidden
    - expression: "request.resource.resource != 'accessbindings' || request.operation == 'DELETE' || !(variables.zot || variables.reg) || object.spec.subjects.all(s, !has(s.systemClass) \u0026\u0026 s.?user.?id.orValue('') != '*' \u0026\u0026 s.?group.?id.orValue('') != '*' \u0026\u0026 s.?serviceAccountRef.?name.orValue('') != '*')"
