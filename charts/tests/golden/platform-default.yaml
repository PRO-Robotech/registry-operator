---
# Source: registry-platform/templates/kaname-module.yaml
# Манифест модуля registry для kaname: роли registry.puller, registry.pusher,
# registry.admin с правилами на репозитории (children) и личность модуля
# kacho-registry, под которой registry-operator регистрирует ресурсы. Типы регистри —
# канон модели образа kaname (files/registry.manifest.yaml, шапка). Ключ — имя файла в
# каталоге доставки манифестов kaname.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "registry-module-manifest"
  namespace: "kaname"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    # По этой метке чарт kaname собирает каталог доставки манифестов из нескольких
    # ConfigMap; каждый ключ — файл <модуль>.manifest.yaml.
    kaname.in-cloud.io/module-manifest: "true"
data:
  registry.manifest.yaml: "# SPDX-License-Identifier: AGPL-3.0-or-later\n#\n# Модуль registry в kaname: типы регистри, роли выдачи на регистри и личность модуля.\n# Документ ведётся здесь; доставляется ключом registry.manifest.yaml (README.md,\n# «Манифест модуля kaname»).\n#\n# Раздел resources — ДОСЛОВНО раздел resources файла\n# internal/manifest/testdata/registry.public-read-fixture.yaml репозитория\n# PRO-Robotech/kaname @93ad1b885469c79f284b9fc629f86fe3dde81a97; оттуда и лицензия этого\n# файла. Он объявляет типы канона модели образа kaname — registry_registry (родитель —\n# проект) и registry_repository (родитель — регистри), — и рендер каждого обязан совпасть\n# с блоком канона побайтово, иначе kaname отказывает в пуске; это судит задание CI\n# kaname-manifest кодом kaname. Раздел нужен потому, что вложенное правило роли (children)\n# kaname судит по указателям parents ЭТОГО манифеста. Правится только вслед за каноном.\n#\n# Публичного чтения модуль не выдаёт: анонимное чтение — pull манифестов и блобов, перечень\n# тегов и проверку версии /v2/ — открывает только флаг --public прокси iam-proxy; запрос без\n# токена к регистри без флага получает 401, и о чтении публичного регистри прокси kaname не\n# спрашивает вовсе. Отношение public_reader и подстановочный субъект на get репозитория — текст\n# канона модели, а не выдача: кортежей с подстановочным субъектом и выдач системным классам\n# registry-operator не пишет, роли и личность ниже их не называют.\n#\n# Примечания (notes) у типов ниже — текст канона kaname, и о registry-operator они говорят не\n# всё верно. Примечание registry_registry утверждает, что v_create спрашивает плоскость данных\n# (docker push в новый репозиторий, монтирование в новый, страж блоба первого push). У этого\n# модуля не так: iam-proxy заводит новый репозиторий правом update на регистри (v_update),\n# класса create на регистри роли ниже не несут, и v_create не спрашивает ни один путь\n# registry-operator. Править примечание здесь нельзя: блок обязан совпасть с каноном побайтово,\n# иначе kaname отказывает в пуске. Правится вслед за каноном.\n\napiVersion: iam/v1\nmodule: registry\n\nresources:\n\n  - name: registries\n    objectType: registry_registry\n    parents: [project]\n    producer: derived\n    publicReadToChildren: true\n    notes:\n      - before: v_get\n        text: |\n          # #64 Defect A: v_* derive from `owner` so a registry's CREATOR/OWNER (the\n          # RegisterResource `owner` tuple) holds the full CRUD verb-set on their own\n          # registry — esp. v_create (create repositories). Without this the owner got\n          # only editor-tier v_get/v_list/v_update/v_delete (the `edit` role authors no\n          # `create` verb) and CreateRepository denied → 404 for the owner. Per-OBJECT\n          # computed relation (like `editor: this or admin`), NOT a hierarchy cascade.\n          #\n          # `v_create` LIVES HERE AND NOWHERE ELSE — do not \"restore parity\" by adding it\n          # back to the other types. A registry is a CONTAINER: \"create a repository in\n          # this namespace\" is a real operation on the registry object, and it is really\n          # asked — by the control plane (CreateRepository / RenameRepository) and by the\n          # data plane (docker push to a new repo, cross-repo mount into a new dst, and\n          # the first-push blob-reveal guard). Every other type answered a question no\n          # request ever asks: \"create\" is not an operation on an already-existing object,\n          # and creating a resource inside a scope is authorized by the write tier on that\n          # scope. Locked by authzmap/verb_relation_has_reader_test.go, which reds with the\n          # type name if a reader-less carrier reappears.\n    relations:\n      - name: owner\n        definition: '[user, service_account]'\n        position: beforeTiers\n    verbs:\n      - {name: get, from: [owner, super_admin]}\n      - {name: list, from: [owner, super_admin]}\n      - {name: create, from: [owner, super_admin]}\n      - {name: update, from: [owner, super_admin]}\n      - {name: delete, from: [owner, super_admin]}\n      - {name: internalGetRegistryStats, class: get, internal: true}\n      - {name: internalTriggerGarbageCollection, class: delete, internal: true}\n\n  - name: repositories\n    objectType: registry_repository\n    parents:\n      - {name: parent, type: registry_registry}\n    producer: authored\n    notes:\n      - before: super_admin\n        text: |\n          # A repository has no project pointer of its own — it is a child of its\n          # registry, and the registry is the one anchored to a project.\n      - before: v_get\n        text: |\n          # RG-1 D-7: `user:*` public-read wildcard — anonymous pull of a PUBLIC repo.\n          # The wildcard grants v_get ONLY on repos that ALSO carry an explicit\n          # `user:* v_get` tuple emitted by the registry overlay (visibility=PUBLIC);\n          # absent that tuple `user:*` has no access → uniform 404. ONLY v_get gains\n          # the wildcard — no write relation does (anon is a read-only floor, B14).\n          # #64 Defect A: v_* derive from `owner` (repo creator/pusher owner-tuple) so\n          # the repo owner fully manages their own repository; `user:*` wildcard stays\n          # on v_get ONLY (anonymous public-read floor, B14).\n    relations:\n      - name: owner\n        definition: '[user, service_account]'\n        position: beforeTiers\n    verbs:\n      - {name: get, subjects: ['user:*', user, service_account, 'group#member'], from: [owner, super_admin]}\n      - {name: list, from: [owner, super_admin]}\n      - {name: update, from: [owner, super_admin]}\n      - {name: delete, from: [owner, super_admin]}\n\n\n# Роль выдаётся на объект registry.registries:\u003cid\u003e — точечно, роботам заказа, — либо на\n# область iam.account с allInScope (каскадно, выдаёт платформа или владелец аккаунта).\n# Верхнее правило — глаголы на сам регистри; вложенное (children) — на каждый его\n# репозиторий, в том числе заведённый после выдачи: репозиторий регистрируется с цепью\n# предков [registry_registry:\u003cid\u003e, project:\u003cprj\u003e]. Класса create на регистри роль модуля не\n# несёт: kaname его ролью модуля не выдаёт (ни одно действие каталога прав его не спрашивает),\n# поэтому заведение репозитория в регистри iam-proxy судит глаголом update на регистри.\n# Выдачу на один репозиторий (цель registry.repositories:\u003cid\u003e/\u003crepo\u003e) kaname принимает,\n# только если тип цели покрыт правилом ВЕРХНЕГО уровня роли: вложенное правило его не\n# покрывает. Поэтому у puller и pusher второе верхнее правило — на репозитории, с теми же\n# классами, что у вложенного; admin точечно на репозиторий не выдаётся.\nroles:\n\n  - id: registry.puller\n    description: \u003e\n      Чтение образов: регистри, названный целью выдачи, и каждый его\n      репозиторий, включая заведённые позже, либо один репозиторий,\n      названный целью выдачи.\n    tier: {tierType: iam.cluster, tierId: cluster_root}\n    rules:\n      - module: registry\n        resources: [registries]\n        classes: [get]\n        children:\n          - resources: [repositories]\n            classes: [get, list]\n      - module: registry\n        resources: [repositories]\n        classes: [get, list]\n\n  - id: registry.pusher\n    description: \u003e\n      Публикация и чтение образов: новые репозитории в регистри, названном\n      целью выдачи, и запись в каждый его репозиторий, либо запись в один\n      репозиторий, названный целью выдачи.\n    tier: {tierType: iam.cluster, tierId: cluster_root}\n    rules:\n      - module: registry\n        resources: [registries]\n        classes: [get, update]\n        children:\n          - resources: [repositories]\n            classes: [get, list, update]\n      - module: registry\n        resources: [repositories]\n        classes: [get, list, update]\n\n  - id: registry.admin\n    description: \u003e\n      Полное управление регистри, названным целью выдачи, и всеми его\n      репозиториями.\n    tier: {tierType: iam.cluster, tierId: cluster_root}\n    rules:\n      - module: registry\n        resources: [registries]\n        classes: [get, list, update, delete]\n        children:\n          - resources: [repositories]\n            classes: [get, list, update, delete]\n\n# Личность модуля: под ней registry-operator регистрирует registry_registry:\u003cid\u003e и\n# registry_repository:\u003cid\u003e/\u003crepo\u003e (RegisterResource на внутреннем листенере kaname по\n# mTLS). Группа module-relation-writers даёт ей запись кортежей владения только к\n# типам своего модуля. Аккаунт системы подставляет чарт (kanameModule.systemAccount).\nseed:\n  serviceAccounts:\n    - name: kacho-registry\n      account: kacho-system\n      description: \"Registry module identity of registry-operator: registers registries and repositories in kaname\"\n  joins:\n    - serviceAccount: {account: kacho-system, name: kacho-registry}\n      group: {account: kacho-system, name: module-relation-writers}\n      why: \"registry-operator пишет кортежи владения регистри и репозиториев через kaname, а не в хранилище прав напрямую\"\n"
---
# Source: registry-platform/templates/addonphase.yaml
# Фаза Addon, которым площадка ставит этот чарт (addons-operator связывает AddonPhase с
# Addon по имени). Объекты края — Gateway и общие маршруты — требуют видов Gateway API;
# пока CRD не Established, базовый слой Addon площадки держит их выключенными, а это
# правило подмешивает слой edge, как только CRD готова. keep защёлкивает правило:
# переустановка CRD объекты края не снимает.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonPhase
metadata:
  name: "registry-platform"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  rules:
    - name: edge
      criteria:
        - source:
            apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: "httproutes.gateway.networking.k8s.io"
          jsonPath: "$.status.conditions[?@.type=='Established'].status"
          operator: Equal
          value: "True"
          keep: true
      selector:
        name: edge
        priority: 50
        matchLabels:
          addons.in-cloud.io/addon: "registry-platform"
          addons.in-cloud.io/values: edge
---
# Source: registry-platform/templates/addontemplates.yaml
# Форма Addon заказа для версии 1.0.0 чарта registry-instance. Её рендерит
# addons-operator из AddonClaim и registry-operator — тем же контекстом ({.Values,
# .Vars}, missingkey=error): версия, репозиторий и digest закреплены здесь, шаблон
# заказа их не пишет. Переменные — ровно перечень слоя заказа.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonTemplate
metadata:
  name: "registry-instance-1.0.0"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    registry.in-cloud.io/chart: "registry-instance"
    registry.in-cloud.io/chart-version: "1.0.0"
  annotations:
    registry.in-cloud.io/chart-digest: "sha256:1d6a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8"
spec:
  template: "spec:\n  backend:\n    finalizer: true\n    namespace: argocd\n    project: {{ \"registry\" | toJson }}\n    syncPolicy:\n      automated:\n        prune: true\n        selfHeal: true\n      retry:\n        backoff:\n          duration: 10s\n          factor: 2\n          maxDuration: 3m\n        limit: 5\n      syncOptions:\n      - ServerSideApply=true\n      - FailOnSharedResource=true\n    type: argocd\n  chart: registry-instance\n  releaseName: {{ printf \"zot-%s\" (.Vars.id | toString) | toJson }}\n  repoURL: oci://ghcr.io/pro-robotech/charts/registry-instance\n  targetCluster: in-cluster\n  targetNamespace: {{ .Vars.login | toString | toJson }}\n  valuesSelectors:\n  - matchLabels:\n      addons.in-cloud.io/addon: registry-instance\n      addons.in-cloud.io/values: order\n    name: order\n    priority: 0\n  - matchLabels:\n      addons.in-cloud.io/addon: registry-instance\n      addons.in-cloud.io/values: site\n    name: site\n    priority: 10\n  variables:\n    bucket: {{ .Vars.bucket | toString | toJson }}\n    endpoint: {{ .Vars.endpoint | toString | toJson }}\n    id: {{ .Vars.id | toString | toJson }}\n    login: {{ .Vars.login | toString | toJson }}\n    public: {{ .Vars.public | toString | toJson }}\n    region: {{ .Vars.region | toString | toJson }}\n    registryUID: {{ .Vars.registryUID | toString | toJson }}\n    syncEpoch: {{ .Vars.syncEpoch | toString | toJson }}\n    vaultAuthMount: {{ .Vars.vaultAuthMount | toString | toJson }}\n    vaultRole: {{ .Vars.vaultRole | toString | toJson }}\n    vaultSecretPath: {{ .Vars.vaultSecretPath | toString | toJson }}\n  version: 1.0.0"
---
# Source: registry-platform/templates/addonphase.yaml
# Слой edge Addon площадки: включает Gateway и общие маршруты.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonValue
metadata:
  name: "registry-platform-edge"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    addons.in-cloud.io/addon: "registry-platform"
    addons.in-cloud.io/values: edge
spec:
  values: "gateway:\n  enabled: true\nsharedRoutes:\n  enabled: true"
---
# Source: registry-platform/templates/addonvalues.yaml
# Слой заказа (priority 0): переносит Addon.spec.variables в values чарта
# registry-instance. Текст слоя — фиксированный файл чарта: только .Variables из
# перечня и функции toJson, regexMatch и has; нечисловая эпоха и public не из
# «true»/«false» остаются строкой, и схема registry-instance отвергает рендер. Значения переменных пишет registry-operator после
# своей проверки.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonValue
metadata:
  name: "registry-instance-order"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    addons.in-cloud.io/addon: "registry-instance"
    addons.in-cloud.io/values: order
spec:
  values: "instance:\n  id: {{ .Variables.id | toJson }}\n  login: {{ .Variables.login | toJson }}\n  registryUID: {{ .Variables.registryUID | toJson }}\n  syncEpoch: {{ if regexMatch \"^[0-9]{1,18}$\" .Variables.syncEpoch }}{{ .Variables.syncEpoch }}{{ else }}{{ .Variables.syncEpoch | toJson }}{{ end }}\n  public: {{ if has .Variables.public (list \"true\" \"false\") }}{{ .Variables.public }}{{ else }}{{ .Variables.public | toJson }}{{ end }}\nstorage:\n  bucket: {{ .Variables.bucket | toJson }}\n  endpoint: {{ .Variables.endpoint | toJson }}\n  region: {{ .Variables.region | toJson }}\nvault:\n  secretPath: {{ .Variables.vaultSecretPath | toJson }}\n  authMount: {{ .Variables.vaultAuthMount | toJson }}\n  role: {{ .Variables.vaultRole | toJson }}\n"
---
# Source: registry-platform/templates/addonvalues.yaml
# Слой площадки (priority 10): константы site.* — CA, адреса Vault, публичного API kaname
# и эндпоинта регистрации registry-operator, образы по digest, сеть, край. Данные без исполняемого текста.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonValue
metadata:
  name: "registry-instance-site"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    addons.in-cloud.io/addon: "registry-instance"
    addons.in-cloud.io/values: site
spec:
  values: "site:\n  caBundle:\n    configMap: platform-ca\n    key: ca.crt\n  edge:\n    proxy:\n      gateway:\n        name: registry-gw\n        namespace: registry-edge\n      namespace: envoy-gateway-system\n    routeNamespace: registry-edge\n  iamProxy:\n    checkTimeout: 2s\n    decisionCacheTTL: 10s\n    enrollTimeout: 15s\n  images:\n    iamProxy:\n      digest: sha256:2e7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809\n      repository: docker.io/prorobotech/registry-iam-proxy\n      tag: v0.1.0\n    zot:\n      digest: sha256:95a837a0afacf5b7edc0c92493f04beee6891989b8d2fd50a00cf65a1e6d4fd5\n      repository: ghcr.io/project-zot/zot-linux-amd64\n      tag: v2.1.20\n  kaname:\n    audience: registry\n    issuer: https://kaname.example.test\n    jwksURL: https://kaname.example.test:9097/.well-known/jwks.json\n    url: https://kaname.example.test:8443\n  network:\n    allowKubeletProbes: false\n    dns:\n      labels:\n        k8s-app: kube-dns\n      namespace: kube-system\n    kaname:\n    - fqdn: kaname.example.test\n      ports:\n      - 8443\n      - 9097\n    registryOperator:\n    - labels:\n        app.kubernetes.io/name: registry-operator\n      namespace: registry-system\n      ports:\n      - 8443\n    vault:\n    - labels:\n        app.kubernetes.io/name: vault\n      namespace: vault\n      ports:\n      - 8200\n  registryOperator:\n    registrationURL: https://registry-operator.registry-system.svc:8443\n    tokenAudience: registry-operator\n  resources:\n    iamProxy:\n      limits:\n        memory: 128Mi\n      requests:\n        cpu: 20m\n        memory: 32Mi\n    scratchSizeLimit: 2Gi\n    vaultAgent:\n      limits:\n        cpu: 100m\n        memory: 64Mi\n      requests:\n        cpu: 10m\n        memory: 32Mi\n    zot:\n      limits:\n        memory: 1Gi\n      requests:\n        cpu: 100m\n        memory: 256Mi\n  vault:\n    address: https://vault.vault.svc:8200\n    tokenAudience: vault"
---
# Source: registry-platform/templates/gateway.yaml
# Gateway края. Принимает только HTTPRoute и только из namespace с метками края:
# маршрутов из namespace арендаторов он не берёт.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: "registry-gw"
  namespace: "registry-edge"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  gatewayClassName: "envoy-gateway"
  listeners:
    - name: "https"
      protocol: HTTPS
      port: 443
      hostname: "registry.example.test"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: "registry-edge-tls"
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels: {"registry.in-cloud.io/edge":"true"}
---
# Source: registry-platform/templates/shared-routes.yaml
# Общий маршрут края /v2/: один на кластер, на все регистри.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "registry-api-root"
  namespace: "registry-edge"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: "registry-gw"
      namespace: "registry-edge"
      sectionName: "https"
  hostnames:
    - "registry.example.test"
  rules:
    - matches:
        - path:
            type: "Exact"
            value: "/v2/"
      backendRefs:
        - group: ""
          kind: Service
          namespace: "registry-system"
          name: "registry-api-root"
          port: 8080
---
# Source: registry-platform/templates/shared-routes.yaml
# Общий маршрут края /iam/token: один на кластер, на все регистри.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "registry-token"
  namespace: "registry-edge"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: "registry-gw"
      namespace: "registry-edge"
      sectionName: "https"
  hostnames:
    - "registry.example.test"
  rules:
    - matches:
        - path:
            type: "Exact"
            value: "/iam/token"
      backendRefs:
        - group: ""
          kind: Service
          namespace: "kaname"
          name: "kaname-token"
          port: 8080
---
