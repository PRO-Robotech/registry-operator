---
# Source: registry-platform/templates/kaname-module.yaml
# Манифест модуля registry для kaname: роли registry.puller, registry.pusher,
# registry.admin с правилами на репозитории (children) и личность модуля
# kacho-registry, под которой registry-operator регистрирует ресурсы. Типы регистри —
# канон модели образа kaname (files/registry.manifest.yaml, шапка). Ключ — имя файла в
# каталоге доставки манифестов kaname.
apiVersion: v1
kind: ConfigMap
metadata:
  name: "registry-module-manifest"
  namespace: "kaname"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    # По этой метке чарт kaname собирает каталог доставки манифестов из нескольких
    # ConfigMap; каждый ключ — файл <модуль>.manifest.yaml.
    kaname.in-cloud.io/module-manifest: "true"
data:
  registry.manifest.yaml: "# Модуль registry в kaname: роли выдачи на регистри и личность модуля. Документ\n# написан для registry-operator и ведётся только здесь; доставляется ключом\n# registry.manifest.yaml (README.md, «Манифест модуля kaname»).\n#\n# Раздела resources здесь нет намеренно. Типы registry_registry (родитель — проект) и\n# registry_repository (родитель — регистри) уже несёт канон модели прав образа kaname, а\n# доставка, объявившая тип канона, обязана совпасть с его блоком побайтово, иначе kaname\n# отказывает в пуске. Свой раздел здесь был бы либо копией чужого текста, либо отказом\n# kaname. Права ниже опираются на глаголы этих типов: на регистри — get, list, create,\n# update, delete (create — «завести репозиторий в этом регистри»), на репозитории — get,\n# list, update, delete.\n#\n# Публичного чтения модуль не объявляет и не выдаёт: анонимный pull включает только\n# флаг --public прокси iam-proxy, кортежей с подстановочным субъектом registry-operator\n# не пишет.\n\napiVersion: iam/v1\nmodule: registry\n\n# Роль выдаётся на объект registry.registries:\u003cid\u003e — точечно, роботам заказа, — либо на\n# область iam.account с allInScope (каскадно, выдаёт платформа или владелец аккаунта).\n# Верхнее правило — глаголы на сам регистри; вложенное (children) — на каждый его\n# репозиторий, в том числе заведённый после выдачи: репозиторий регистрируется с цепью\n# предков [registry_registry:\u003cid\u003e, project:\u003cprj\u003e].\nroles:\n\n  - id: registry.puller\n    description: \u003e\n      Чтение образов: регистри, названный целью выдачи, и каждый его\n      репозиторий, включая заведённые позже.\n    tier: {tierType: iam.cluster, tierId: cluster_root}\n    rules:\n      - module: registry\n        resources: [registries]\n        classes: [get]\n        children:\n          - resources: [repositories]\n            classes: [get, list]\n\n  - id: registry.pusher\n    description: \u003e\n      Публикация и чтение образов: новые репозитории в регистри, названном\n      целью выдачи, и запись в каждый его репозиторий.\n    tier: {tierType: iam.cluster, tierId: cluster_root}\n    rules:\n      - module: registry\n        resources: [registries]\n        classes: [get, create]\n        children:\n          - resources: [repositories]\n            classes: [get, list, update]\n\n  - id: registry.admin\n    description: \u003e\n      Полное управление регистри, названным целью выдачи, и всеми его\n      репозиториями.\n    tier: {tierType: iam.cluster, tierId: cluster_root}\n    rules:\n      - module: registry\n        resources: [registries]\n        classes: [get, list, create, update, delete]\n        children:\n          - resources: [repositories]\n            classes: [get, list, update, delete]\n\n# Личность модуля: под ней registry-operator регистрирует registry_registry:\u003cid\u003e и\n# registry_repository:\u003cid\u003e/\u003crepo\u003e (RegisterResource на внутреннем листенере kaname по\n# mTLS). Группа module-relation-writers даёт ей запись кортежей владения только к\n# типам своего модуля. Аккаунт системы подставляет чарт (kanameModule.systemAccount).\nseed:\n  serviceAccounts:\n    - name: kacho-registry\n      account: kacho-system\n      description: \"Registry module identity of registry-operator: registers registries and repositories in kaname\"\n  joins:\n    - serviceAccount: {account: kacho-system, name: kacho-registry}\n      group: {account: kacho-system, name: module-relation-writers}\n      why: \"registry-operator пишет кортежи владения регистри и репозиториев через kaname, а не в хранилище прав напрямую\"\n"
---
# Source: registry-platform/templates/addonphase.yaml
# Фаза Addon, которым площадка ставит этот чарт (addons-operator связывает AddonPhase с
# Addon по имени). Объекты края — Gateway и общие маршруты — требуют видов Gateway API;
# пока CRD не Established, базовый слой Addon площадки держит их выключенными, а это
# правило подмешивает слой edge, как только CRD готова. keep защёлкивает правило:
# переустановка CRD объекты края не снимает.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonPhase
metadata:
  name: "registry-platform"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  rules:
    - name: edge
      criteria:
        - source:
            apiVersion: apiextensions.k8s.io/v1
            kind: CustomResourceDefinition
            name: "httproutes.gateway.networking.k8s.io"
          jsonPath: "$.status.conditions[?@.type=='Established'].status"
          operator: Equal
          value: "True"
          keep: true
      selector:
        name: edge
        priority: 50
        matchLabels:
          addons.in-cloud.io/addon: "registry-platform"
          addons.in-cloud.io/values: edge
---
# Source: registry-platform/templates/addontemplates.yaml
# Форма Addon заказа для версии 1.0.0 чарта registry-instance. Её рендерит
# addons-operator из AddonClaim и registry-operator — тем же контекстом ({.Values,
# .Vars}, missingkey=error): версия, репозиторий и digest закреплены здесь, шаблон
# заказа их не пишет. Переменные — ровно перечень слоя заказа.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonTemplate
metadata:
  name: "registry-instance-1.0.0"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    registry.in-cloud.io/chart: "registry-instance"
    registry.in-cloud.io/chart-version: "1.0.0"
  annotations:
    registry.in-cloud.io/chart-digest: "sha256:1d6a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f8"
spec:
  template: "spec:\n  backend:\n    finalizer: true\n    namespace: argocd\n    project: {{ \"registry\" | toJson }}\n    syncPolicy:\n      automated:\n        prune: true\n        selfHeal: true\n      retry:\n        backoff:\n          duration: 10s\n          factor: 2\n          maxDuration: 3m\n        limit: 5\n      syncOptions:\n      - ServerSideApply=true\n      - FailOnSharedResource=true\n    type: argocd\n  chart: registry-instance\n  releaseName: {{ printf \"zot-%s\" (.Vars.id | toString) | toJson }}\n  repoURL: oci://ghcr.io/pro-robotech/charts/registry-instance\n  targetCluster: in-cluster\n  targetNamespace: {{ .Vars.login | toString | toJson }}\n  valuesSelectors:\n  - matchLabels:\n      addons.in-cloud.io/addon: registry-instance\n      addons.in-cloud.io/values: order\n    name: order\n    priority: 0\n  - matchLabels:\n      addons.in-cloud.io/addon: registry-instance\n      addons.in-cloud.io/values: site\n    name: site\n    priority: 10\n  variables:\n    bucket: {{ .Vars.bucket | toString | toJson }}\n    endpoint: {{ .Vars.endpoint | toString | toJson }}\n    id: {{ .Vars.id | toString | toJson }}\n    login: {{ .Vars.login | toString | toJson }}\n    public: {{ .Vars.public | toString | toJson }}\n    region: {{ .Vars.region | toString | toJson }}\n    registryUID: {{ .Vars.registryUID | toString | toJson }}\n    syncEpoch: {{ .Vars.syncEpoch | toString | toJson }}\n    vaultAuthMount: {{ .Vars.vaultAuthMount | toString | toJson }}\n    vaultRole: {{ .Vars.vaultRole | toString | toJson }}\n    vaultSecretPath: {{ .Vars.vaultSecretPath | toString | toJson }}\n  version: 1.0.0"
---
# Source: registry-platform/templates/addonphase.yaml
# Слой edge Addon площадки: включает Gateway и общие маршруты.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonValue
metadata:
  name: "registry-platform-edge"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    addons.in-cloud.io/addon: "registry-platform"
    addons.in-cloud.io/values: edge
spec:
  values: "gateway:\n  enabled: true\nsharedRoutes:\n  enabled: true"
---
# Source: registry-platform/templates/addonvalues.yaml
# Слой заказа (priority 0): переносит Addon.spec.variables в values чарта
# registry-instance. Текст слоя — фиксированный файл чарта: только .Variables из
# перечня и функции toJson, regexMatch и has; нечисловая эпоха и public не из
# «true»/«false» остаются строкой, и схема registry-instance отвергает рендер. Значения переменных пишет registry-operator после
# своей проверки.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonValue
metadata:
  name: "registry-instance-order"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    addons.in-cloud.io/addon: "registry-instance"
    addons.in-cloud.io/values: order
spec:
  values: "instance:\n  id: {{ .Variables.id | toJson }}\n  login: {{ .Variables.login | toJson }}\n  registryUID: {{ .Variables.registryUID | toJson }}\n  syncEpoch: {{ if regexMatch \"^[0-9]{1,18}$\" .Variables.syncEpoch }}{{ .Variables.syncEpoch }}{{ else }}{{ .Variables.syncEpoch | toJson }}{{ end }}\n  public: {{ if has .Variables.public (list \"true\" \"false\") }}{{ .Variables.public }}{{ else }}{{ .Variables.public | toJson }}{{ end }}\nstorage:\n  bucket: {{ .Variables.bucket | toJson }}\n  endpoint: {{ .Variables.endpoint | toJson }}\n  region: {{ .Variables.region | toJson }}\nvault:\n  secretPath: {{ .Variables.vaultSecretPath | toJson }}\n  authMount: {{ .Variables.vaultAuthMount | toJson }}\n  role: {{ .Variables.vaultRole | toJson }}\n"
---
# Source: registry-platform/templates/addonvalues.yaml
# Слой площадки (priority 10): константы site.* — CA, адреса Vault, публичного API kaname
# и эндпоинта регистрации registry-operator, образы по digest, сеть, край. Данные без исполняемого текста.
apiVersion: addons.in-cloud.io/v1alpha1
kind: AddonValue
metadata:
  name: "registry-instance-site"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
    addons.in-cloud.io/addon: "registry-instance"
    addons.in-cloud.io/values: site
spec:
  values: "site:\n  caBundle:\n    configMap: platform-ca\n    key: ca.crt\n  edge:\n    proxy:\n      gateway:\n        name: registry-gw\n        namespace: registry-edge\n      namespace: envoy-gateway-system\n    routeNamespace: registry-edge\n  iamProxy:\n    checkTimeout: 2s\n    decisionCacheTTL: 10s\n    enrollTimeout: 15s\n    realm: https://registry.example.test/iam/token\n    service: registry.example.test\n  images:\n    iamProxy:\n      digest: sha256:2e7b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809\n      repository: docker.io/prorobotech/registry-iam-proxy\n      tag: v0.1.0\n    zot:\n      digest: sha256:95a837a0afacf5b7edc0c92493f04beee6891989b8d2fd50a00cf65a1e6d4fd5\n      repository: ghcr.io/project-zot/zot-linux-amd64\n      tag: v2.1.20\n  kaname:\n    address: kaname.example.test:9090\n    audience: registry\n    issuer: https://kaname.example.test\n    jwksURL: https://kaname.example.test:9097/.well-known/jwks.json\n    serverName: kaname.example.test\n  network:\n    allowKubeletProbes: false\n    dns:\n      labels:\n        k8s-app: kube-dns\n      namespace: kube-system\n    kaname:\n    - fqdn: kaname.example.test\n      ports:\n      - 9090\n      - 9097\n    registryOperator:\n    - labels:\n        app.kubernetes.io/name: registry-operator\n      namespace: registry-system\n      ports:\n      - 8443\n    vault:\n    - labels:\n        app.kubernetes.io/name: vault\n      namespace: vault\n      ports:\n      - 8200\n  registryOperator:\n    registrationURL: https://registry-operator.registry-system.svc:8443\n    tokenAudience: registry-operator\n  resources:\n    iamProxy:\n      limits:\n        memory: 128Mi\n      requests:\n        cpu: 20m\n        memory: 32Mi\n    scratchSizeLimit: 2Gi\n    vaultAgent:\n      limits:\n        cpu: 100m\n        memory: 64Mi\n      requests:\n        cpu: 10m\n        memory: 32Mi\n    zot:\n      limits:\n        memory: 1Gi\n      requests:\n        cpu: 100m\n        memory: 256Mi\n  vault:\n    address: https://vault.vault.svc:8200\n    tokenAudience: vault"
---
# Source: registry-platform/templates/gateway.yaml
# Gateway края. Принимает только HTTPRoute и только из namespace с метками края:
# маршрутов из namespace арендаторов он не берёт.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: "registry-gw"
  namespace: "registry-edge"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  gatewayClassName: "envoy-gateway"
  listeners:
    - name: "https"
      protocol: HTTPS
      port: 443
      hostname: "registry.example.test"
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: "registry-edge-tls"
      allowedRoutes:
        kinds:
          - group: gateway.networking.k8s.io
            kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels: {"registry.in-cloud.io/edge":"true"}
---
# Source: registry-platform/templates/shared-routes.yaml
# Общий маршрут края /v2/: один на кластер, на все регистри.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "registry-api-root"
  namespace: "registry-edge"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: "registry-gw"
      namespace: "registry-edge"
      sectionName: "https"
  hostnames:
    - "registry.example.test"
  rules:
    - matches:
        - path:
            type: "Exact"
            value: "/v2/"
      backendRefs:
        - group: ""
          kind: Service
          namespace: "registry-system"
          name: "registry-api-root"
          port: 8080
---
# Source: registry-platform/templates/shared-routes.yaml
# Общий маршрут края /iam/token: один на кластер, на все регистри.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: "registry-token"
  namespace: "registry-edge"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: "registry-gw"
      namespace: "registry-edge"
      sectionName: "https"
  hostnames:
    - "registry.example.test"
  rules:
    - matches:
        - path:
            type: "Exact"
            value: "/iam/token"
      backendRefs:
        - group: ""
          kind: Service
          namespace: "kaname"
          name: "kaname-token"
          port: 8080
---
# Source: registry-platform/templates/shared-routes.yaml
# Разрешение общим маршрутам края ссылаться на Service в kaname — и только на названные.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: registry-edge-routes
  namespace: "kaname"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: "registry-edge"
  to:
    - group: ""
      kind: Service
      name: "kaname-token"
---
# Source: registry-platform/templates/shared-routes.yaml
# Разрешение общим маршрутам края ссылаться на Service в registry-system — и только на названные.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: registry-edge-routes
  namespace: "registry-system"
  labels:
    app.kubernetes.io/name: registry-platform
    app.kubernetes.io/instance: "registry-platform"
    app.kubernetes.io/part-of: registry
    app.kubernetes.io/managed-by: "Helm"
    helm.sh/chart: "registry-platform-1.0.0"
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: "registry-edge"
  to:
    - group: ""
      kind: Service
      name: "registry-api-root"
