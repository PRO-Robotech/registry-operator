---
# SA пода zot; на него выписана роль Vault заказа (zot-<id>), им же iam-proxy входит в
# эндпоинт регистрации registry-operator. Токен API в под не монтируется: vault-agent и
# iam-proxy получают projected-токены каждый со своей аудиторией отдельными томами.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ri.base" . | toJson }}
  labels:
    {{- include "ri.labels" (dict "root" . "component" "workload") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
