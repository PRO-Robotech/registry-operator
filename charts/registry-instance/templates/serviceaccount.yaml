{{- include "ri.check" . }}
---
# SA пода zot; на него выписана роль Vault заказа (zot-<id>). Токен API в под не
# монтируется: vault-agent получает projected-токен с аудиторией Vault отдельным
# томом, zot и сайдкару токен API не нужен.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ri.base" . | toJson }}
  labels:
    {{- include "ri.labels" (dict "root" . "component" "workload") | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
automountServiceAccountToken: false
