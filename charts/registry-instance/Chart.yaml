apiVersion: v2
name: registry-instance
description: >-
  The zot of one on-demand registry with its iam-proxy: service account, pod
  network policy, Service and Deployment (zot on S3 behind iam-proxy, which
  checks each request with the client's own kaname token). Installed through an
  Addon written by registry-operator, which owns the bucket, the Vault role, the
  IAM robot, binding and resource tuple and the edge route.
type: application
version: 1.0.1
appVersion: "v2.1.20"
kubeVersion: ">=1.30.0-0"
home: https://github.com/PRO-Robotech/registry-operator
sources:
  - https://github.com/PRO-Robotech/registry-operator/tree/main/charts/registry-instance
keywords:
  - registry
  - zot
  - oci
annotations:
  artifacthub.io/license: Apache-2.0
