                        pattern: ^[a-z0-9]([a-z0-9-]{0,40}[a-z0-9])?$
                        type: string
                      version:
                        description: 'Version — ревизия линии: v1, v2, …'
                        maxLength: 7
                        pattern: ^v[0-9]{1,6}$
                        type: string
                    required:
                    - name
                    - version
                    type: object
                  iamServiceAccount:
                    description: IamServiceAccount — ObservedIamServiceAccountTemplate
                      (шаг identity).
                    properties:
                      name:
                        description: Name — имя линии шаблона (templateName).
                        maxLength: 42
                        pattern: ^[a-z0-9]([a-z0-9-]{0,40}[a-z0-9])?$
                        type: string
                      version:
                        description: 'Version — ревизия линии: v1, v2, …'
                        maxLength: 7
                        pattern: ^v[0-9]{1,6}$
                        type: string
                    required:
                    - name
                    - version
                    type: object
                  s3BucketClaim:
                    description: S3BucketClaim — ObservedS3BucketClaimTemplate (шаг
                      storage).
                    properties:
                      name:
                        description: Name — имя линии шаблона (templateName).
                        maxLength: 42
                        pattern: ^[a-z0-9]([a-z0-9-]{0,40}[a-z0-9])?$
                        type: string
                      version:
                        description: 'Version — ревизия линии: v1, v2, …'
                        maxLength: 7
                        pattern: ^v[0-9]{1,6}$
                        type: string
                    required:
                    - name
                    - version
                    type: object
                  vaultClaim:
                    description: VaultClaim — ObservedVaultClaimTemplate (шаг secrets).
                    properties:
                      name:
                        description: Name — имя линии шаблона (templateName).
                        maxLength: 42
                        pattern: ^[a-z0-9]([a-z0-9-]{0,40}[a-z0-9])?$
                        type: string
                      version:
                        description: 'Version — ревизия линии: v1, v2, …'
                        maxLength: 7
                        pattern: ^v[0-9]{1,6}$
                        type: string
                    required:
                    - name
                    - version
                    type: object
                required:
                - addon
                - httpRoute
                - s3BucketClaim
                - vaultClaim
                type: object
                x-kubernetes-validations:
                - message: identity and access templates must be supplied together
                    or both omitted
                  rule: has(self.iamServiceAccount) == has(self.iamAccessBinding)
              version:
                description: Version — ревизия линии.
                maxLength: 7
                pattern: ^v[0-9]{1,6}$
                type: string
            required:
            - claimPolicy
            - templateName
            - templates
            - version
            type: object
            x-kubernetes-validations:
            - message: RegistryTemplate spec is immutable; publish a new version
              rule: self == oldSelf
          status:
            description: TemplateStatus — состояние ревизии шаблона (общая форма всех
              видов).
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
