    - registry-templates
    kind: RegistryTemplate
    listKind: RegistryTemplateList
    plural: registrytemplates
    shortNames:
    - regtpl
    singular: registrytemplate
  scope: Cluster
  versions:
  - additionalPrinterColumns:
