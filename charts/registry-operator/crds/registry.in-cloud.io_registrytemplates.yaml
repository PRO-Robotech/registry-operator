                        pattern: ^[a-z0-9]([a-z0-9-]{0,40}[a-z0-9])?$
                        type: string
                      version:
                        description: 'Version — ревизия линии: v1, v2, …'
                        maxLength: 7
                        pattern: ^v[0-9]{1,6}$
                        type: string
                    required:
                    - name
                    - version
                    type: object
                  httpRoute:
                    description: HTTPRoute — ObservedHTTPRouteTemplate (шаг route).
                    properties:
                      name:
                        description: Name — имя линии шаблона (templateName).
                        maxLength: 42
                        pattern: ^[a-z0-9]([a-z0-9-]{0,40}[a-z0-9])?$
                        type: string
                      version:
                        description: 'Version — ревизия линии: v1, v2, …'
                        maxLength: 7
                        pattern: ^v[0-9]{1,6}$
                        type: string
                    required:
                    - name
                    - version
                    type: object
                  iamAccessBinding:
                    description: IamAccessBinding — ObservedIamAccessBindingTemplate
