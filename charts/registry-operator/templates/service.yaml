apiVersion: v1
kind: Service
metadata:
  name: {{ include "ro.name" . }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "ro.labels" . | nindent 4 }}
spec:
  selector: {{- include "ro.selector" . | nindent 4 }}
  ports:
  - name: enrollment
    port: {{ .Values.enrollment.port }}
    targetPort: enrollment
  - name: metrics
    port: {{ .Values.metrics.port }}
    targetPort: metrics
